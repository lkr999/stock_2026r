[project]
name = "candlestick-trader-backend"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "aiohttp>=3.11",
  "numpy>=2.1",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.6", "joblib>=1.4"]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
