# Caginalp candlestick trading system — Rust backend (axum + tokio).
# Mirrors the former FastAPI service one-for-one; all market data comes from
# the eBest REST API only (no synthetic data).
[package]
name = "caginalp-trader"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "caginalp-trader"
path = "src/main.rs"

[dependencies]
axum = "0.7"                                            # HTTP framework
tokio = { version = "1", features = ["full"] }          # async runtime
tower-http = { version = "0.5", features = ["cors"] }   # CORS layer
serde = { version = "1", features = ["derive"] }        # (de)serialization
serde_json = "1"                                        # JSON values
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }  # eBest HTTP client
csv = "1"                                               # universe loader
chrono = { version = "0.4", features = ["clock"] }      # KST timestamps
chrono-tz = "0.9"                                        # Asia/Seoul
tracing = "0.1"                                          # logging
tracing-subscriber = "0.3"
dotenvy = "0.15"                                         # .env loading
